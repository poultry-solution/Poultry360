name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-backend.yml"
      - "apps/backend/**"
      - "packages/shared-types/**"
      - "Dockerfile"
      - "scripts/docker-entrypoint.sh"
      - "scripts/seed-demo-prod.sh"
      - "pnpm-lock.yaml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/poultry360-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/poultry360-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # `set -e` makes every command fatal. If the pre-deploy backup
          # fails we abort BEFORE touching the running container — the new
          # image (which runs `prisma migrate deploy` at startup) never
          # gets a chance to change the schema without a snapshot covering
          # it. Backup is run from the home dir where the script lives;
          # we cd into the app dir only for the docker compose commands.
          script: |
            set -e
            ~/backup-all-daily.sh
            cd ~/p360
            docker compose -f docker-compose.yml pull backend
            docker compose -f docker-compose.yml up -d backend
            docker image prune -f
